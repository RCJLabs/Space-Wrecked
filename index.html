<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <!-- Offline always: nothing may load from another origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070a14" />
    <!-- The title is set from src/config.js. -->
    <title></title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/ui/style.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <canvas id="board" aria-hidden="true"></canvas>
    <div id="ui">
      <div id="screen"></div>
    </div>
    <div id="rotate" role="alert">
      <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" aria-hidden="true">
        <rect x="30" y="12" width="36" height="72" rx="7" />
        <line x1="42" y1="74" x2="54" y2="74" />
      </svg>
      <p>Turn your phone sideways</p>
      <small>This game plays in landscape.</small>
    </div>
    <noscript>This game needs JavaScript.</noscript>
  </body>
</html>
